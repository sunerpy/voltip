// The Kotlin side of the Rust shell (docs/mobile-rn.md §2). scripts/build-android-rn.sh builds
// `libvoltip_rn.so` into src/main/jniLibs and generates its UniFFI bindings into
// src/main/java/dev/voltip/rn/uniffi (both git-ignored) before Gradle runs.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.voltip.rn'
version = '0.0.44'

android {
  namespace "dev.voltip.rn"
  defaultConfig {
    versionCode 1
    versionName '0.0.44'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // UniFFI's Kotlin bindings call the Rust library through JNA (5.12 or newer); the AAR carries
  // libjnidispatch for every ABI, and the app's ABI filter keeps arm64-v8a's.
  implementation "net.java.dev.jna:jna:5.19.1@aar"
  // The navigation bar's buttons in the windows React Native opens over the activity
  // (ExtraWindowEventListener), as expo-navigation-bar did before VoltipNativeModule took it over.
  implementation 'com.facebook.react:react-android'
  // The floating bubble's decisions (BubbleSwipeDecision, BubblePasteDecision, BubbleAutoStow) as
  // JVM unit tests under src/test: scripts/build-android-rn.sh runs :voltip-native:testReleaseUnitTest.
  testImplementation 'junit:junit:4.13.2'
}
