<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Android 13 themed icons: the sound bars and the cursor in one colour; the launcher tints them. Scaled to two thirds about the centre so that it stays inside the 66 dp safe circle of the
       108 dp canvas (the generator draws the canvas whole and ignores android_fg_scale for SVG). -->
  <g transform="translate(512 512) scale(0.67) translate(-512 -512)">
    <rect x="244" y="402" width="84" height="220" rx="42" fill="#FFFFFF"/>
    <rect x="376" y="302" width="84" height="420" rx="42" fill="#FFFFFF"/>
    <rect x="508" y="362" width="84" height="300" rx="42" fill="#FFFFFF"/>
    <rect x="708" y="232" width="72" height="560" rx="36" fill="#FFFFFF"/>
  </g>
</svg>
