<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The adaptive icon's foreground: the sound bars and the cursor on transparency. Scaled to two thirds about the centre so that it stays inside the 66 dp safe circle of the
       108 dp canvas (the generator draws the canvas whole and ignores android_fg_scale for SVG). -->
  <defs>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.67) translate(-512 -512)">
    <rect x="244" y="402" width="84" height="220" rx="42" fill="#FFFFFF"/>
    <rect x="376" y="302" width="84" height="420" rx="42" fill="#FFFFFF"/>
    <rect x="508" y="362" width="84" height="300" rx="42" fill="#FFFFFF"/>
    <rect x="708" y="232" width="72" height="560" rx="36" fill="url(#cursor)"/>
  </g>
</svg>
