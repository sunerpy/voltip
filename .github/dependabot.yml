# Dependency updates: SHA-pinned Actions stay current, Cargo and npm move in weekly grouped PRs.
# rebase-strategy: disabled keeps stale dependency branches from rebuilding (each rebase reruns the
# whole CI) after every default-branch merge; request a rebase when merging.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /
    rebase-strategy: disabled
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]
