# Experiment branch only (never merged): what a new build signed with the same self-signed
# certificate may read from the keychain. See scripts/experiment-keychain.sh.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keychain:
    name: keychain partition experiment · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the experiment
        run: bash scripts/experiment-keychain.sh
      - name: Update the released 0.0.7 to 0.0.8 (manual checklist item 15, the versions the plan names)
        run: bash scripts/experiment-upgrade.sh 0.0.7 0.0.8
      - name: Update the released 0.0.10 to 0.0.11 (manual checklist item 15)
        run: bash scripts/experiment-upgrade.sh 0.0.10 0.0.11
