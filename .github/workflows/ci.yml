# Voltip continuous integration on GitHub-hosted runners.
#
# The gates live in the repository (Makefile, scripts/verify-all.sh): CI installs the toolchain and
# runs `make verify` (its rust and web halves in two parallel jobs), `make windows-x64`,
# `make smoke-desktop` / `make smoke-wayland` and the headless native run, so a shell and CI run
# the same thing and the verify logs bind every result to the exact commit.
#
# Speed (measured 2026-09-28): the Rust tests run once, under coverage; Cargo caches are saved only
# from main (a pull request's cache is visible to that pull request alone, and the repository's
# 10 GB cap was evicting main's); a change that touches documentation only runs verify-web (ledger,
# host guard, formatting) and skips the builds, which CI Success accepts only in that case. Windows packages are cross-built from Linux exactly as `make windows-x64`
# does locally (cargo-xwin + lld-link + llvm-rc + clang + makensis), then run on a real Windows
# runner by `windows-native`. macOS builds and runs on both processors in `macos` (pushes to main
# and on demand). release-please's pull request and the commit it lands on main only bump
# versions: they run verify-web, since the release candidate (release-candidate.yml) builds and
# checks every package from that exact head, whose base passed this CI.
#
# The main ruleset requires the `Release candidate` commit status on a pull request's head:
# release-candidate.yml writes it for release-please's pull request, `candidate-status` writes
# "not a release PR" for every other one. There is no merge queue (the ruleset has no merge_queue
# rule, and nothing would write that status for a merge group), so there is no merge_group trigger.
#
# No job here receives the built-in engine values (docs/dictation.md §3): the gates are hermetic,
# the CI package is engine-less on purpose (VOLTIP_ALLOW_NO_BUILTIN_ENGINES=1) and the smokes use a
# mock recogniser, so a pull request from a fork runs what the default branch runs. The one
# secret is the production-host guard's word list, read by a single step that forks skip; the
# guard prints path:line only. Coverage goes to Codecov from a separate job that CI Success does
# not wait for: the numeric floors are `make verify`'s own gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A full run on any branch, the macOS jobs included (they skip pull requests).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: "1"
  # Line tables only in dev / test builds: backtraces keep file:line, the codegen and link are
  # cheaper and target/ (the cache) is smaller (Cargo book, build performance).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Hosted runners lose the odd download: retry crates, the index and rustup components.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Toolchain pins. The Rust toolchain itself comes from rust-toolchain.toml (rustup reads it);
  # these are the cargo subcommands `make verify` / `make windows-x64` need.
  CARGO_LLVM_COV_VERSION: 0.8.7
  CARGO_DENY_VERSION: 0.19.9
  CARGO_XWIN_VERSION: 0.20.2
  CARGO_ABOUT_VERSION: 0.9.2
  NODE_MAJOR: "22"

jobs:
  # Documentation-only changes and release-please's version bumps skip the build, test and
  # platform jobs (scripts: changed-code.sh); a new branch or any doubt runs everything.
  changes:
    name: changes · code or documentation only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout (the classifier script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: .github/scripts/changed-code.sh

  # The `Release candidate` status the main ruleset requires, for a pull request that is not
  # release-please's: release-candidate.yml writes it for that one, after building its head.
  # release-please's pull request is recognised by author and branch, not by its label, which
  # arrives after the `opened` event. A fork's or Dependabot's read-only token cannot write a
  # status: the job warns, and the owner merges such a pull request past the rule.
  candidate-status:
    name: Release candidate · not a release PR
    if: >-
      github.event_name == 'pull_request' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--main--'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the head as not a release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context='Release candidate' -f description='not a release PR' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null; then
            echo "::warning title=Release candidate::this token cannot write commit statuses (a fork or Dependabot); merging needs the owner's bypass"
          fi

  # The Rust half of scripts/verify-all.sh: formatting, features, clippy, the cross-checks, the test
  # suite under coverage (the one test run), cargo-deny and the IPC e2e.
  verify-rust:
    name: verify · rust gates
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (only when short)
        run: .github/scripts/free-disk-space.sh 40

      - name: Runner facts
        run: |
          set -euo pipefail
          uname -srm; nproc; free -g | head -2; df -h / | tail -1
          node --version || true; python3 --version; rustup --version

      # Tauri Linux shell (webkit2gtk, gtk, soup, dbus, appindicator, rsvg), cpal (ALSA),
      # x11/xcb headers for the injector and hotkey plugin.
      - name: Linux system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libx11-dev libxtst-dev libxcb1-dev patchelf pkg-config cmake

      # rust-toolchain.toml pins the channel plus clippy / rustfmt / llvm-tools-preview; rustup
      # installs exactly that.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show
          # verify-all.sh cross-check-darwin / cross-check-windows (docs/dictation.md §15.6): std
          # only, nothing is linked, so no Apple SDK or MSVC CRT is needed.
          rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
          rustc --version && cargo --version && cargo clippy --version && cargo fmt --version

      - name: cargo-llvm-cov and cargo-deny (prebuilt, pinned)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }},cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Cache Cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-verify
          cache-on-failure: true
          # Tools come prebuilt from install-action; ~/.cargo/bin need not ride in the cache.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache prunes the runtime sherpa-onnx-sys's build script downloaded and copied, but
      # keeps its fingerprint: make cargo run it again (the script says why).
      - name: Re-run sherpa-onnx-sys's build script
        run: .github/scripts/forget-sherpa-onnx-build.sh

      # The IPC e2e is a vitest suite (packages/shared) driving two real Rust cores.
      - name: pnpm (packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Install web dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Rust gates (VERIFY_GATES=rust scripts/verify-all.sh)
        env:
          VERIFY_GATES: rust
        run: ./scripts/verify-all.sh verify-rust.log

      # lcov from the coverage-gate run (no second test run).
      - name: Coverage report for Codecov
        run: make coverage-lcov

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload verify-rust.log (bound to the commit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-rust-log
          path: verify-rust.log
          if-no-files-found: warn
          retention-days: 7

  # The web half of scripts/verify-all.sh, plus the ledger, the host guard and the release helpers;
  # it runs for every change, documentation included. No Rust toolchain is needed.
  verify-web:
    name: verify · web gates and ledger
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm (packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Install web dependencies (frozen lockfile)
        run: |
          set -euo pipefail
          node --version; pnpm --version
          pnpm install --frozen-lockfile

      - name: Web gates (VERIFY_GATES=web scripts/verify-all.sh)
        env:
          VERIFY_GATES: web
        run: ./scripts/verify-all.sh verify-web.log

      # The same guard the web gates run, with the word list they cannot see there. Pull requests
      # from forks and from Dependabot get no repository secrets and skip it (a Dependabot update
      # only touches manifests and lockfiles; `main` runs the guard again once it is merged);
      # everything else must have the list configured.
      - name: No production hosts anywhere in the tree
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]')
        env:
          VOLTIP_PRODUCTION_HOSTS: ${{ secrets.VOLTIP_PRODUCTION_HOSTS }}
        run: .github/scripts/check-no-production-hosts.sh --require

      - name: Upload the coverage reports
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-web
          path: |
            apps/desktop/coverage/lcov.info
            apps/mobile/coverage/lcov.info
            packages/shared/coverage/lcov.info
            packages/ui/coverage/lcov.info
            services/feedback/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Upload verify-web.log (bound to the commit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-web-log
          path: verify-web.log
          if-no-files-found: warn
          retention-days: 7

  # Reporting only: the floors are enforced by `make verify`. Pull requests from forks upload
  # without a token (Codecov accepts that for public repositories); everything else uses
  # CODECOV_TOKEN. Without the secret (a fork, or a repository not yet connected to Codecov) an
  # upload failure is a warning, not a red build.
  codecov:
    name: coverage · Codecov upload
    needs: [verify-rust, verify-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CODECOV_TOKEN_SET: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Checkout (paths in the reports resolve against the tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Rust coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-rust

      - name: Download the web coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-web

      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          flags: rust
          disable_search: true
          fail_ci_if_error: ${{ env.CODECOV_TOKEN_SET == 'true' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload web coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./apps/desktop/coverage/lcov.info,./apps/mobile/coverage/lcov.info,./packages/shared/coverage/lcov.info,./packages/ui/coverage/lcov.info,./services/feedback/coverage/lcov.info
          flags: web
          disable_search: true
          fail_ci_if_error: ${{ env.CODECOV_TOKEN_SET == 'true' }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Cross-built Windows x64 package (portable zip + NSIS installer) via the repository script.
  windows-cross:
    name: windows-x64 · cross-build (cargo-xwin)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # An engine-less package on purpose: CI proves the build, the release bakes the defaults in.
      VOLTIP_ALLOW_NO_BUILTIN_ENGINES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (only when short)
        run: .github/scripts/free-disk-space.sh 40

      # scripts/build-windows-x64.sh requires cargo-xwin, lld-link, llvm-rc, llvm-readobj,
      # llvm-dlltool, clang, makensis, zip and unzip.
      - name: Windows cross toolchain (nsis, clang, lld, llvm)
        run: |
          set -euo pipefail
          sudo apt-get update
          # LLVM 19: the MSVC STL headers cargo-xwin downloads (current CRT) refuse older clang
          # ("STL1000: expected Clang 19.0.0 or newer"); Ubuntu 24.04 ships 19 as clang-19.
          sudo apt-get install --yes --no-install-recommends nsis clang-19 lld-19 llvm-19 cmake ninja-build zip unzip
          echo "/usr/lib/llvm-19/bin" >>"$GITHUB_PATH"
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          lld-link --version; command -v llvm-rc; clang --version | head -1; makensis -VERSION

      - name: Rust toolchain (rust-toolchain.toml) + Windows target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show
          rustup target add x86_64-pc-windows-msvc
          rustc --version && cargo --version

      - name: cargo-xwin (prebuilt, pinned)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-xwin@${{ env.CARGO_XWIN_VERSION }}

      # THIRD-PARTY-NOTICES.txt (scripts/release/third-party-notices.py) for the package.
      - name: cargo-about (prebuilt, pinned)
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}

      - name: Tauri CLI (`cargo tauri`, pinned tarball + SHA-256)
        run: .github/scripts/install-cargo-tauri.sh

      - name: Cache Cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-windows-cross
          cache-on-failure: true
          # Tools come prebuilt from install-action; ~/.cargo/bin need not ride in the cache.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache prunes the runtime sherpa-onnx-sys's build script downloaded and copied, but
      # keeps its fingerprint: make cargo run it again (the script says why).
      - name: Re-run sherpa-onnx-sys's build script
        run: .github/scripts/forget-sherpa-onnx-build.sh

      # The MSVC CRT + SDK cargo-xwin unpacks (~1 GB from download.visualstudio.microsoft.com) is
      # fetched once per cargo-xwin version and restored afterwards; the download itself is
      # retried because that host resets connections under load.
      - name: Cache the xwin MSVC CRT and SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin/xwin
          key: xwin-crt-sdk-${{ runner.os }}-cargo-xwin-${{ env.CARGO_XWIN_VERSION }}

      - name: Fetch the xwin MSVC CRT and SDK (retried)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cache/cargo-xwin/xwin/DONE" ]; then echo "xwin CRT/SDK restored from cache"; exit 0; fi
          for attempt in 1 2 3 4 5; do
            if cargo xwin check --target x86_64-pc-windows-msvc -p voltip-protocol >/dev/null 2>&1 || [ -f "$HOME/.cache/cargo-xwin/xwin/DONE" ]; then
              echo "xwin CRT/SDK ready (attempt $attempt)"; exit 0
            fi
            rm -rf "$HOME/.cache/cargo-xwin/xwin"
            echo "xwin download failed (attempt $attempt), retrying in $((attempt * 20)) s"; sleep $((attempt * 20))
          done
          echo "::error::could not download the MSVC CRT/SDK after 5 attempts"; exit 1

      - name: pnpm (packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Install web dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The Vulkan SDK and runtime downloads scripts/lib/vulkan-sdk.sh pins (by SHA-256); the
      # script extracts them on every run.
      - name: Cache the Vulkan SDK and runtime downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/voltip-vulkan/*.tar.xz
            ~/.cache/voltip-vulkan/*.zip
          key: vulkan-downloads-${{ hashFiles('scripts/lib/vulkan-sdk.sh') }}

      # Unsigned by design: tauri.conf.json never sets bundle.createUpdaterArtifacts (the release
      # workflow enables it with --config on its signing step), so no key is needed here.
      # cargo-about takes about two minutes here; the notices depend only on these inputs.
      - name: Cache the third-party notices
        id: notices
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/desktop/src-tauri/resources/THIRD-PARTY-NOTICES.txt
          key: notices-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'pnpm-lock.yaml', 'package.json', 'about.toml', 'scripts/release/third-party-notices.py', 'scripts/release/licenses/**') }}

      - name: make windows-x64 (portable zip + NSIS installer, Vulkan, artefact secret scan)
        env:
          VOLTIP_NOTICES_CACHED: ${{ steps.notices.outputs.cache-hit == 'true' && '1' || '0' }}
        run: make windows-x64

      - name: Upload dist/windows-x64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voltip-windows-x64
          path: dist/windows-x64
          if-no-files-found: error
          retention-days: 7

  # The cross-built package on real Windows: the unpacked portable zip's headless entry points
  # through scripts/smoke-native-cli.ps1 (the exe starts, so its imports — static CRT, the bundled
  # sherpa-onnx DLLs and Vulkan loader — resolve; with no GPU driver on the runner it lists no GPU
  # and runs on the CPU; it downloads a model with its own downloader and transcribes a public
  # Chinese sample), then the NSIS installer installs silently and the installed copy runs the same
  # check.
  # Then the portable exe's real window (scripts/smoke-windows-gui.ps1: close to the tray, reopen
  # with a second launch, `--quit`). The hotkey, microphone and paste stay verified on a user's
  # desktop (docs/acceptance.md).
  windows-native:
    name: windows-x64 · native run (Windows Server)
    needs: [windows-cross]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (the smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner facts
        run: |
          $PSVersionTable.PSVersion.ToString()
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber | Format-List | Out-String).Trim()
          (Get-CimInstance Win32_Processor | Select-Object -First 1).Name

      - name: Download dist/windows-x64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: voltip-windows-x64
          path: dist-windows

      - name: Portable zip — unpack, headless native run
        run: |
          $zip = Get-ChildItem dist-windows -Filter '*_x64-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no portable zip in the artifact' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath portable
          $exe = Get-ChildItem portable -Recurse -Filter 'voltip-desktop.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no voltip-desktop.exe in the portable zip' }
          Get-ChildItem $exe.DirectoryName | ForEach-Object { "  $($_.Name) $($_.Length)" }
          ./scripts/smoke-native-cli.ps1 -Binary $exe.FullName -Models sense-voice-small,qwen3-asr-0.6b -OutDir smoke-native-windows

      # The runner has an interactive desktop (the lone-key hook tests rely on it too). Its own
      # timeout keeps the log when a window step hangs.
      - name: Portable exe — real window (close to tray, second launch, --quit)
        timeout-minutes: 5
        run: |
          $exe = Get-ChildItem portable -Recurse -Filter 'voltip-desktop.exe' | Select-Object -First 1
          ./scripts/smoke-windows-gui.ps1 -Binary $exe.FullName -OutDir smoke-windows-gui

      # The history's paste button on the same desktop: Notepad in front, Voltip on top of it; the
      # entry lands in Notepad and Voltip stays minimised. Windows PowerShell for UI Automation.
      - name: Portable exe — paste a history entry into Notepad
        timeout-minutes: 5
        shell: powershell
        run: |
          $exe = Get-ChildItem portable -Recurse -Filter 'voltip-desktop.exe' | Select-Object -First 1
          ./scripts/smoke-windows-paste.ps1 -Binary $exe.FullName -OutDir smoke-windows-paste

      - name: NSIS installer — silent install, then the installed exe
        run: |
          $setup = Get-ChildItem dist-windows -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no NSIS installer in the artifact' }
          # WebView2 before / after: the installer's WebView2 section is the step that can abort.
          $wv2 = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 before: $((Get-ItemProperty -Path $wv2 -Name pv -ErrorAction SilentlyContinue).pv)"
          $install = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(900000)) { $install.Kill($true); throw 'installer did not finish within 15 minutes' }
          "installer exit code: $($install.ExitCode)"
          "WebView2 after: $((Get-ItemProperty -Path $wv2 -Name pv -ErrorAction SilentlyContinue).pv)"
          if ($install.ExitCode -ne 0) {
            $log = 'C:\ProgramData\Microsoft\EdgeUpdate\Log\MicrosoftEdgeUpdate.log'
            if (Test-Path $log) { 'EdgeUpdate log (tail):'; Get-Content $log -Tail 40 }
            throw "installer failed with exit code $($install.ExitCode)"
          }
          # Where it went: the per-user uninstall key names InstallLocation. A runner that executes
          # as SYSTEM gets the 32-bit NSIS stub's WOW64 file-system redirection, so the SYSTEM
          # profile's `system32\config\systemprofile` lands in `SysWOW64\...`; a normal user
          # install under C:\Users is not redirected. Both are looked up.
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Voltip'
          $location = ((Get-ItemProperty -Path $key -Name InstallLocation -ErrorAction SilentlyContinue).InstallLocation) -replace '"', ''
          "InstallLocation (registry): $location"
          $candidates = @($location, ($location -replace '(?i)\\system32\\', '\SysWOW64\'), (Join-Path $env:LOCALAPPDATA 'Voltip')) | Where-Object { $_ } | Select-Object -Unique
          $exe = $candidates | ForEach-Object { Join-Path $_ 'voltip-desktop.exe' } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1 | ForEach-Object { Get-Item -LiteralPath $_ }
          if (-not $exe) { throw "installed voltip-desktop.exe not found in: $($candidates -join '; ')" }
          "installed at: $($exe.DirectoryName)"
          Get-ChildItem $exe.DirectoryName -Filter '*.dll' | ForEach-Object { "  $($_.Name) $($_.Length)" }
          ./scripts/smoke-native-cli.ps1 -Binary $exe.FullName -Models sense-voice-small,qwen3-asr-0.6b -OutDir smoke-native-windows-installed

      - name: Upload the run summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-run
          path: |
            smoke-native-windows/*.txt
            smoke-native-windows/*.out
            smoke-native-windows/*.err
            smoke-native-windows-installed/*.txt
            smoke-native-windows-installed/*.out
            smoke-native-windows-installed/*.err
            smoke-windows-gui/*.txt
            smoke-windows-gui/*.log
            smoke-windows-paste/*.txt
            smoke-windows-paste/*.log
          if-no-files-found: warn
          retention-days: 7

  # The real Tauri desktop app started under Xvfb with the debug-only in-memory secret store;
  # the WebView screenshots are the evidence that the shell builds, starts the core and renders.
  # The lone-key trigger's real low-level hooks (docs/dictation.md §13.1) on a Windows desktop:
  # WH_KEYBOARD_LL / WH_MOUSE_LL installed, fed with SendInput, edges asserted. Only the small
  # voltip-hooks crate is built, natively.
  hooks-windows:
    name: windows · lone-key hooks on a real desktop
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show
          rustc --version && cargo --version

      - name: Cache Cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-hooks-windows
          cache-on-failure: true
          # Tools come prebuilt from install-action; ~/.cargo/bin need not ride in the cache.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Built first and on its own, so a hang in the real test is told apart from a slow build, and
      # the test step has a timeout short enough to leave its log readable.
      - name: Build the hook tests
        run: cargo test -p voltip-hooks --lib --no-run

      - name: Real hooks (cargo test -p voltip-hooks -- --ignored)
        timeout-minutes: 5
        run: cargo test -p voltip-hooks --lib -- --ignored --test-threads=1 --nocapture

  smoke-desktop:
    name: smoke · desktop under Xvfb
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (only when short)
        run: .github/scripts/free-disk-space.sh 40

      # X11 (Xvfb) and pure Wayland (headless weston + sway) smokes: a private PulseAudio null sink is
      # the microphone, xclip / wl-clipboard check the clipboard restore, wtype is the Wayland paste.
      - name: Linux system dependencies + Xvfb / Wayland tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libx11-dev libxtst-dev libxcb1-dev patchelf pkg-config cmake \
            xvfb xdotool scrot x11-utils python3-pil \
            xclip pulseaudio pulseaudio-utils libasound2-plugins \
            weston sway wtype wl-clipboard grim dbus
          command -v Xvfb xdotool scrot xclip pulseaudio pactl paplay weston sway wtype wl-copy grim dbus-daemon
          /usr/bin/python3 -c 'import PIL; print("PIL", PIL.__version__)'

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show
          rustc --version && cargo --version

      - name: Cache Cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-smoke-desktop
          cache-on-failure: true
          # Tools come prebuilt from install-action; ~/.cargo/bin need not ride in the cache.
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache prunes the runtime sherpa-onnx-sys's build script downloaded and copied, but
      # keeps its fingerprint: make cargo run it again (the script says why).
      - name: Re-run sherpa-onnx-sys's build script
        run: .github/scripts/forget-sherpa-onnx-build.sh

      - name: pnpm (packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Install web dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The lone-key trigger's XInput 2 hook on a real X server (docs/dictation.md §13.1), fed with
      # xdotool through XTEST.
      - name: Real X11 hook (cargo test -p voltip-hooks -- --ignored, under Xvfb)
        run: xvfb-run -a cargo test -p voltip-hooks --lib -- --ignored --test-threads=1 --nocapture

      - name: make smoke-desktop (build, start under Xvfb, hotkey → overlay → outcome, screenshots)
        run: make smoke-desktop

      # Pure Wayland on headless compositors: session detection, the refused-hotkey hint for
      # --toggle, a take pasted through wtype and the clipboard restored.
      - name: make smoke-wayland (headless weston + sway, --toggle, wtype paste, clipboard restore)
        run: make smoke-wayland

      # Same headless check the Windows job runs, on the binary the smoke just built.
      - name: Headless native run (download a model, transcribe a public sample)
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null || { echo "::error::pwsh (PowerShell 7) is not on this runner image"; exit 1; }
          pwsh -NoProfile -File scripts/smoke-native-cli.ps1 -Binary target/debug/voltip-desktop -Models sense-voice-small,qwen3-asr-0.6b -OutDir smoke-native-linux

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-linux-smoke
          path: |
            docs/acceptance/screens/tauri/*.png
            docs/acceptance/screens/tauri/*-app.log
            docs/acceptance/screens/tauri/desktop-linux-wayland-summary.txt
            smoke-native-linux/*.txt
            smoke-native-linux/*.out
          if-no-files-found: warn
          retention-days: 7

  # Stable branch-protection check: every job above except the Codecov upload must report success.
  # The build, test and platform jobs may be skipped only when `changes` found documentation alone;
  # any other skip, and every failure or cancellation, fails.
  # macOS on both processors (moved here from macos.yml, 2026-09-28): the app and the dmg, signed
  # ad hoc as the release signs them and checked the same way (.github/scripts/
  # check-macos-bundle.sh), the macOS-only unit tests, the real event tap on Apple silicon, and the
  # same headless run the Windows and Linux jobs do (scripts/smoke-native-cli.ps1), which proves the
  # bundle's dylibs load and the ggml / sherpa-onnx engines run natively. About 20 minutes on
  # macos-15 and more on macos-15-intel (GitHub's last x86_64 image, until 2027-08), so it runs on
  # pushes to main and on demand, not on pull requests, and CI Success does not wait for it. The
  # release commit skips it with the rest (changed-code.sh): the release run builds both Macs.
  macos:
    name: macos-${{ matrix.arch }} · build + native run
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOS_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner facts
        run: |
          set -euo pipefail
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; sysctl -n hw.ncpu
          xcode-select -p; clang --version | head -1; cmake --version | head -1 || true

      - name: Rust toolchain (rust-toolchain.toml) + ${{ matrix.target }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 2>/dev/null || true
          rustup target add "$MACOS_TARGET"
          rustc --version && cargo --version

      # Saved from main only (this workflow runs on main and on demand): the next push starts warm.
      - name: Cache Cargo registry and target/
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-${{ matrix.arch }}
          cache-on-failure: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # rust-cache prunes the runtime sherpa-onnx-sys's build script downloaded and copied, but
      # keeps its fingerprint: make cargo run it again (the script says why).
      - name: Re-run sherpa-onnx-sys's build script
        run: .github/scripts/forget-sherpa-onnx-build.sh

      - name: CMake (transcribe.cpp / ggml source build)
        run: command -v cmake || brew install cmake

      - name: Tauri CLI (`cargo tauri`, pinned zip + SHA-256)
        run: .github/scripts/install-cargo-tauri.sh

      - name: pnpm (packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm

      - name: Install web dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The macOS-only unit tests: the platform tables and the injector, including the live
      # keyboard-layout read (`mac_layout_id`) that no Linux host can exercise.
      - name: macOS unit tests (voltip-platform, voltip-inject)
        run: cargo test -p voltip-platform -p voltip-inject

      # The lone-key trigger's real event tap (docs/dictation.md §13.1). An active CGEventTap and
      # CGEventPost both need the Accessibility permission; the runner's TCC database grants it to
      # the test binary (the runner image allows writing it), then the ignored test installs the
      # tap, posts Right Control, Right Control + C and the back button, and asserts the edges.
      - name: Real event tap (Accessibility granted to the test binary)
        if: matrix.arch == 'aarch64'
        run: |
          set -euo pipefail
          csrutil status || true
          bin=$(cargo test -p voltip-hooks --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "voltip_hooks") | .executable' | tail -1)
          [ -x "$bin" ] || { echo "::error::no test binary for voltip-hooks"; exit 1; }
          echo "test binary: $bin"
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          for service in kTCCServiceAccessibility kTCCServicePostEvent; do
            sudo sqlite3 "$db" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified) VALUES ('$service', '$bin', 1, 2, 4, 1, 'UNUSED', 0, $(date +%s));"
          done
          sudo sqlite3 "$db" "SELECT service, client, auth_value FROM access WHERE client = '$bin';"
          "$bin" --ignored --test-threads=1 --nocapture

      # A restored target/ may hold the dmg of an earlier version.
      - name: Build Voltip.app and the dmg (signed ad hoc)
        run: |
          set -euo pipefail
          rm -rf "target/$MACOS_TARGET/release/bundle"
          # Compile once, then bundle with the release's retry (hdiutil fails now and then).
          (cd apps/desktop && cargo tauri build --ci --target "$MACOS_TARGET" --no-bundle && \
            ../../.github/scripts/tauri-bundle-retry.sh "../../target/$MACOS_TARGET/release/bundle" -- --ci --target "$MACOS_TARGET" --bundles app,dmg)
          app="target/$MACOS_TARGET/release/bundle/macos/Voltip.app"
          [ -d "$app" ] || { echo "::error::no .app bundle was produced"; exit 1; }
          echo "APP=$app" >>"$GITHUB_ENV"
          ls -la "$app/Contents/MacOS" "$app/Contents/Frameworks" || true
          otool -L "$app/Contents/MacOS/voltip-desktop"

      - name: Check the app and the dmg (as release.yml does)
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          .github/scripts/check-macos-bundle.sh "target/$MACOS_TARGET/release/bundle" "$version" "$MACOS_ARCH"
          cp "target/$MACOS_TARGET/release/bundle/dmg/"*.dmg .

      # The release guard's negative case (docs/runbook.md 发布 · macOS 签名): this build is signed ad
      # hoc, so the check a release candidate runs must refuse it, and for that reason.
      - name: The release guard refuses an ad-hoc app
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          requirement=$(jq -r .macos_signing.designated_requirement .github/release-targets.json)
          if .github/scripts/check-macos-bundle.sh "target/$MACOS_TARGET/release/bundle" "$version" "$MACOS_ARCH" --expect-requirement "$requirement" >guard.log 2>&1; then
            cat guard.log
            echo "::error::the release guard accepted an ad-hoc app"
            exit 1
          fi
          grep -F "signed ad hoc, not with the release certificate" guard.log

      - name: Headless native run (download a model, transcribe a public sample)
        shell: pwsh
        # Both engines: sherpa-onnx (SenseVoice, the bundled dylibs) and transcribe.cpp (Qwen3-ASR
        # GGUF, ggml built for Apple silicon), as the Windows job does.
        run: ./scripts/smoke-native-cli.ps1 -Binary "$env:APP/Contents/MacOS/voltip-desktop" -Models sense-voice-small,qwen3-asr-0.6b -OutDir smoke-native-macos-${{ matrix.arch }}

      # The desktop around the app (scripts/smoke-tray-macos.sh): the title bar's left end keeps
      # the brand clear of the traffic lights (user feedback 2026-09-29), and the menu bar item, its
      # menu and every entry work. A CI build has no update source, so no Check for Updates.
      - name: The traffic lights, the menu bar item and its entries on the desktop
        env:
          VOLTIP_NO_UPDATER: "1"
          VOLTIP_CHECK_CHROME: "1"
        run: scripts/smoke-tray-macos.sh "$APP" "smoke-tray-macos-${{ matrix.arch }}"

      - name: Archive the app
        run: ditto -c -k --keepParent "$APP" "dist-macos-${{ matrix.arch }}.zip"

      - name: Upload the app and the run summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voltip-macos-${{ matrix.arch }}
          path: |
            dist-macos-${{ matrix.arch }}.zip
            Voltip_*_${{ matrix.arch }}.dmg
            smoke-native-macos-${{ matrix.arch }}/*.txt
            smoke-native-macos-${{ matrix.arch }}/*.out
            smoke-tray-macos-${{ matrix.arch }}/*.png
            smoke-tray-macos-${{ matrix.arch }}/*.txt
            smoke-tray-macos-${{ matrix.arch }}/*.log
          if-no-files-found: warn
          retention-days: 7

  ci-success:
    name: CI Success
    needs: [changes, verify-rust, verify-web, windows-cross, windows-native, hooks-windows, smoke-desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq .
          echo "code=${CODE}"
          jq -e --arg code "$CODE" '
            .changes.result == "success" and .["verify-web"].result == "success" and
            (to_entries | map(select(.key != "changes" and .key != "verify-web")) | all(
              .value.result == "success" or
              ($code == "false" and .value.result == "skipped")))' <<<"$NEEDS_JSON"
