# Experiment branch only (never merged): what a new build signed with the same self-signed
# certificate may read from the keychain. See scripts/experiment-keychain.sh.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keychain:
    name: keychain partition experiment · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login keychain partitions
        run: bash scripts/experiment-login-partition.sh
