# Pushes the pages of voltip.firlab.app into sunerpy/firlab, which builds and deploys the site
# (firlab: `voltip/`, `.github/workflows/deploy-voltip.yml`). docs/site/README.md describes the
# whole path.
#
# The sync pushes instead of the site pulling: the credential stays in the repository that owns
# the content and reaches firlab only, and a documentation change and the site update share one
# commit boundary. The copy rules and checks live in firlab's sync script, which a local preview
# runs too, so this workflow and a preview produce the same tree.
#
# Needs FIRLAB_DOCS_TOKEN: a fine-grained personal access token for sunerpy/firlab only, with
# Contents read and write and nothing else. GitHub has no API that creates one, so it is made by
# hand (.github/README-secrets.md).
name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/architecture.md"
      - "docs/dictation.md"
      - "docs/frontend.md"
      - "docs/pairing.md"
      - "docs/protocol.md"
      - "docs/threat-model.md"
      - "docs/state-machines.md"
      - "docs/feedback.md"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

# Queue, never cancel: a cancelled run could leave a pushed sync without its successor.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Push the site's pages to firlab
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Voltip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: voltip
          persist-credentials: false

      # Full history, so a rejected push can rebase onto a newer main.
      - name: Checkout firlab
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sunerpy/firlab
          token: ${{ secrets.FIRLAB_DOCS_TOKEN }}
          path: firlab
          fetch-depth: 0

      - name: Sync the pages
        run: ./firlab/voltip/scripts/sync-voltip-docs.sh "$GITHUB_WORKSPACE/voltip"

      - name: Commit and push
        working-directory: firlab
        env:
          VOLTIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `git status`, not `git diff`: a new page is an untracked file, which `git diff` misses.
          if [ -z "$(git status --porcelain -- voltip/src)" ]; then
            echo "the site is already up to date; nothing to push"
            exit 0
          fi

          # The sync writes nowhere else; staging the tree by name keeps anything else out.
          git add -- voltip/src
          git -c user.name='voltip-docs[bot]' \
              -c user.email='voltip-docs@users.noreply.github.com' \
              commit -m "docs(voltip): sync from voltip@${VOLTIP_SHA:0:7}" \
                     -m "Source: https://github.com/sunerpy/voltip/commit/${VOLTIP_SHA}"

          # zuno's sync pushes to the same branch. The two touch different directories, so a
          # rejected push rebases onto the new tip and tries again.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/main"
            git -c user.name='voltip-docs[bot]' \
                -c user.email='voltip-docs@users.noreply.github.com' \
                pull --rebase origin main
          done
          echo "::error::the sync commit could not be pushed after 3 attempts"
          exit 1
