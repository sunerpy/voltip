# The one-line installers (scripts/install.sh, scripts/install.ps1) against a published release, on
# every computer they serve: Linux with the .deb and with the AppImage, macOS on Apple silicon and
# on Intel, and Windows in Windows PowerShell 5.1 (what `irm | iex` runs in). Each job runs the
# script the way the README says, then proves the installed app answers `--version`, and on a Mac
# that the app is the right architecture, sealed, and not quarantined. On Linux, voltip-server
# (`install.sh --server`, from the release that first ships it) also has to start headless, answer
# over HTTP and stop cleanly on SIGTERM. On Windows and on both Macs
# it then drives the release's tray on the desktop: the icon is the mark, the menu lists the
# build's entries, and each one works (scripts/smoke-tray-{windows.ps1,macos.sh}; the screenshots
# are kept as artifacts).
#
# Run by hand after a release is published (a release published with GITHUB_TOKEN starts no
# workflow): `gh workflow run install-scripts.yml -f version=<version>`. The refusals (checksum
# mismatch, missing asset, unknown release, malformed version) need a fake release and are
# checked locally.
name: Install scripts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to install, for example 0.0.4 (empty: the latest)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: linux · ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [deb, appimage]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with scripts/install.sh
        env:
          VOLTIP_VERSION: ${{ inputs.version }}
          VOLTIP_PACKAGE: ${{ matrix.package }}
        run: sh scripts/install.sh

      # An AppImage takes the libraries every desktop has from the host (graphics, sound, fonts,
      # X11: the ones below are what 0.0.4's AppImage links and does not carry). The runner is a
      # headless server without libEGL and friends, so it gets them here; the .deb pulls its own
      # through apt.
      # Through the mirror-safe installer (2026-10-07: a bare apt-get sat on the Azure mirror until
      # the job timed out, after the 0.0.45 release).
      - name: The desktop libraries an AppImage expects from the host
        if: matrix.package == 'appimage'
        run: >-
          .github/scripts/apt-install.sh
          libasound2t64 libdrm2 libegl1 libgl1 libgbm1 libexpat1 libfontconfig1 libfreetype6
          libfribidi0 libharfbuzz0b libx11-6 libx11-xcb1 libxcb1

      - name: The installed app answers
        env:
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = deb ]; then
            out=$(voltip-desktop --version)
          else
            test -s "$HOME/.local/share/applications/voltip.desktop"
            cat "$HOME/.local/share/applications/voltip.desktop"
            # The runner has no FUSE 2; the AppImage runtime can run from an extracted copy.
            out=$(APPIMAGE_EXTRACT_AND_RUN=1 "$HOME/.local/bin/Voltip.AppImage" --version)
          fi
          echo "$out"
          case "$out" in "voltip ${VERSION#v}"*) ;; *) echo "::error::unexpected --version: $out"; exit 1 ;; esac

  # The headless local speech service (docs/dictation.md §23.5) on a server without a desktop: the
  # tar.gz into ~/.local/share/voltip-server, then the service itself on its default address with
  # the built-in engines. A silent take is answered without reaching any engine.
  linux-server:
    name: linux · server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with scripts/install.sh --server
        env:
          VOLTIP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sh scripts/install.sh --server 2>&1 | tee "$RUNNER_TEMP/install.log"
          # A library the binary takes from the system and the runner lacks: the packages the
          # script named are the user's next step, so they are this job's too.
          packages=$(sed -n 's/^voltip-install: install them with: sudo apt-get install //p' "$RUNNER_TEMP/install.log")
          if [ -n "$packages" ]; then
            echo "installing what the script named: $packages"
            # shellcheck disable=SC2086 # one package per word
            .github/scripts/apt-install.sh $packages
          fi

      - name: The service starts headless, answers and stops on SIGTERM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          server=$HOME/.local/bin/voltip-server
          out=$("$server" --version)
          echo "$out"
          case "$out" in "voltip-server ${VERSION#v}"*) ;; *) echo "::error::unexpected --version: $out"; exit 1 ;; esac
          "$server" --check
          "$server" >"$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          timeout 60 sh -c 'until curl -sf http://127.0.0.1:47840/healthz >/dev/null; do sleep 1; done' ||
            { cat "$RUNNER_TEMP/server.log"; echo "::error::voltip-server was not ready on 127.0.0.1:47840 within 60 s"; exit 1; }
          token=$("$server" --print-token)
          echo "::add-mask::$token"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:47840/v1/models)
          [ "$code" = 401 ] || { echo "::error::/v1/models without the token answered $code"; exit 1; }
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:47840/v1/models >"$RUNNER_TEMP/models.json"
          python3 -c 'import json, sys; ids = [m["id"] for m in json.load(open(sys.argv[1]))["data"]]; print(ids); assert {"voltip", "voltip:raw"} <= set(ids)' "$RUNNER_TEMP/models.json"
          # One second of silence at 24 kHz, as Paseo sends it: 200 and no text, no engine called.
          python3 -c 'import sys, wave; w = wave.open(sys.argv[1], "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(24000); w.writeframes(bytes(48000)); w.close()' "$RUNNER_TEMP/silence.wav"
          code=$(curl -s -o "$RUNNER_TEMP/text.json" -w '%{http_code}' -H "Authorization: Bearer $token" \
            -F file=@"$RUNNER_TEMP/silence.wav" -F model=voltip -F language=zh -F response_format=json \
            http://127.0.0.1:47840/v1/audio/transcriptions)
          cat "$RUNNER_TEMP/text.json"; echo
          [ "$code" = 200 ] && [ "$(cat "$RUNNER_TEMP/text.json")" = '{"text":""}' ] ||
            { cat "$RUNNER_TEMP/server.log"; echo "::error::the silent take answered $code"; exit 1; }
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          cat "$RUNNER_TEMP/server.log"
          [ "$status" = 0 ] || { echo "::error::voltip-server exited $status on SIGTERM"; exit 1; }
          uploads=$HOME/.local/share/voltip/serve/uploads
          [ -z "$(ls -A "$uploads" 2>/dev/null)" ] || { echo "::error::$uploads is not empty after the stop"; exit 1; }

  macos:
    name: macos · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with scripts/install.sh
        env:
          VOLTIP_VERSION: ${{ inputs.version }}
        run: sh scripts/install.sh

      - name: The installed app is this Mac's, sealed, not quarantined, and answers
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          app=/Applications/Voltip.app
          # Nothing has started it yet, and LaunchServices already lists it, so Launchpad and
          # Spotlight find it (user feedback 2026-09-29: only after `open -a Voltip` before).
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -dump >"$RUNNER_TEMP/launchservices.txt"
          grep -m1 -E "^path: +$app( |$)" "$RUNNER_TEMP/launchservices.txt" ||
            { echo "::error::LaunchServices does not list $app after the install"; exit 1; }
          # Spotlight indexes at its own pace (the first run found it in seconds, a later one not
          # within a minute), so a slow index is a warning; LaunchServices above is the check.
          if mdutil -s / 2>/dev/null | grep -q 'Indexing enabled'; then
            deadline=$((SECONDS + 180))
            until mdfind "kMDItemCFBundleIdentifier == 'dev.voltip.desktop'" | grep -qx "$app"; do
              if [ "$SECONDS" -ge "$deadline" ]; then echo "::warning::Spotlight had not indexed $app 3 minutes after the install"; break; fi
              sleep 3
            done
            mdfind "kMDItemCFBundleIdentifier == 'dev.voltip.desktop'" | grep -qx "$app" && echo "Spotlight finds $app"
          else
            echo "::notice::Spotlight indexing is off on this runner; only the LaunchServices registration is checked"
          fi
          [ "$(lipo -archs "$app/Contents/MacOS/voltip-desktop")" = "$ARCH" ]
          codesign --verify --deep --strict "$app"
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then echo "::error::the app is quarantined"; exit 1; fi
          out=$("$app/Contents/MacOS/voltip-desktop" --version)
          echo "$out"
          case "$out" in "voltip ${VERSION#v}"*) ;; *) echo "::error::unexpected --version: $out"; exit 1 ;; esac

      # The release's menu bar item on this Mac's desktop: the V, the menu, and every entry
      # (scripts/smoke-tray-macos.sh).
      - name: The menu bar item shows the mark, and every menu entry works
        env:
          # The title bar keeps its content 12 pt clear of the traffic lights from 0.0.6 on;
          # releases before it fail here by design.
          VOLTIP_CHECK_CHROME: "1"
        run: scripts/smoke-tray-macos.sh /Applications/Voltip.app smoke-tray-macos

      - name: Keep the menu bar evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-macos-${{ matrix.arch }}
          path: smoke-tray-macos/
          if-no-files-found: warn
          retention-days: 30

  windows:
    name: windows · PowerShell 5.1
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `irm <url> | iex` evaluates the script text in the current session; so does this.
      - name: Install with scripts/install.ps1
        shell: powershell
        env:
          VOLTIP_VERSION: ${{ inputs.version }}
        run: Get-Content -Raw scripts/install.ps1 | Invoke-Expression

      - name: The installed app answers, and the installer started it
        shell: powershell
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:LOCALAPPDATA "Voltip\voltip-desktop.exe"
          if (-not (Test-Path $exe)) { throw "no $exe" }
          $running = Get-Process -Name "voltip-desktop" -ErrorAction SilentlyContinue
          if (-not $running) { throw "the installer did not start Voltip" }
          $running | Stop-Process -Force
          $out = (& $exe --version | Out-String).Trim()
          Write-Output $out
          $want = "voltip " + ($env:VERSION -replace '^v', '')
          if (-not $out.StartsWith($want)) { throw "unexpected --version: $out" }

      # The release's tray on this desktop: the mark in the notification area, the right-click
      # menu, and every entry (scripts/smoke-tray-windows.ps1).
      - name: The tray icon shows the mark, and every menu entry works
        shell: powershell
        run: ./scripts/smoke-tray-windows.ps1 -Binary (Join-Path $env:LOCALAPPDATA 'Voltip\voltip-desktop.exe') -OutDir smoke-tray-windows

      - name: Keep the tray evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-windows
          path: smoke-tray-windows/
          if-no-files-found: warn
          retention-days: 30
