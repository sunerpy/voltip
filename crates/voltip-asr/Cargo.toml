[package]
name = "voltip-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Speech-to-text clients for the dictation pipeline: OpenAI-compatible multipart /v1/audio/transcriptions, Alibaba Cloud Model Studio's chat, multimodal and realtime WebSocket protocols, and the protocols of 豆包语音, Tencent Cloud, iFlytek, Baidu, StepFun, GLM-ASR and MiMo-ASR."

[lints]
workspace = true

[dependencies]
# The vendor clients (src/vendor.rs, docs/dictation.md §3.15): one trait object per service.
async-trait.workspace = true
# Model Studio (src/dashscope.rs, src/duplex.rs): the WAV as a base64 data URI, the realtime
# models' WebSocket task protocol (tokio-tungstenite, Mozilla's roots on every target like the relay
# connection; rustls pinned to aws-lc-rs, reqwest's provider), task ids.
base64.workspace = true
futures-util.workspace = true
# The vendors' request signatures and frames (docs/dictation.md §3.15): iFlytek's dated HMAC-SHA256
# and HMAC-SHA1 over an MD5, Tencent Cloud's HMAC-SHA1, 豆包语音's gzip-compressed frames; the
# RFC 1123 date iFlytek signs.
chrono.workspace = true
flate2.workspace = true
hmac.workspace = true
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
# Ogg Opus uploads to the built-in service (src/ogg_opus.rs, docs/dictation.md §3.9): the phone take's encoder.
opus-rs.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
# The proxy of the requests and of the realtime models' WebSocket (docs/dictation.md §24).
voltip-net.workspace = true
# What the service said when it refused a request, for the errors (docs/dictation.md §3.12).
voltip-reply.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
webpki-root-certs.workspace = true
wiremock.workspace = true
