[package]
name = "voltip-inject"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Puts dictated text into the foreground application: clipboard plus paste chord, with clipboard restore."

[lints]
workspace = true

[features]
default = []
# `FakeInjector`, a recording test double for shells and the core. Always compiled for this
# crate's own tests.
test-support = []

[dependencies]
arboard.workspace = true
enigo.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The macOS Cmd+V keycode fallback and modifier hold (docs/dictation.md §15.2): pure tables, no OS calls.
voltip-platform = { path = "../voltip-platform" }

# Linux: images survive an injection (docs/dictation.md §14.3): arboard reads and writes the
# clipboard's PNG as RGBA through the `image` crate; Windows and macOS keep raw bytes instead.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["image-data"] }
# GNOME's remote-desktop portal as the paste keyboard (src/portal, docs/dictation.md §14.9): its
# D-Bus calls through zbus's async API under async-io (the versions zbus and voltip-focus already
# pull), the EIS keyboard through reis (MIT, pure Rust, no unsafe code), its keymap through
# xkbcommon (the version enigo already links), poll and the monotonic clock through rustix.
async-io = "=2.6.0"
futures-util.workspace = true
reis = { version = "=0.7.1", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["event", "std", "time"] }
xkbcommon = { version = "=0.9.0", default-features = false }
zbus = "=5.19.0"

# macOS: the current keyboard layout's input source id, read per keystroke from the HIToolbox
# preference domain (`mac_layout_id`). NSUserDefaults is thread-safe, unlike the TIS calls behind
# UCKeyTranslate. The versions tray-icon / muda already pull.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSUserDefaults"] }
# The pasteboard's items and their typed data, kept whole across an injection (docs/dictation.md
# §14.3). The version arboard already pulls; these methods are safe bindings.
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

# Windows: every raw clipboard format and the clipboard's sequence number (docs/dictation.md
# §14.3). The version arboard already pulls.
[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "=5.4.3", features = ["std"] }

[dev-dependencies]
# Fake paste tools on a private PATH directory (src/process.rs, src/linux.rs tests).
tempfile.workspace = true
# Also the fake remote-desktop portal and EIS keyboard of tests/support/portal.rs, on a private
# D-Bus session bus, are built from the Linux dependencies above.
