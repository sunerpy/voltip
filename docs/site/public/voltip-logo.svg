<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Voltip">
  <!-- The app mark 「声波光标」 (packages/ui/src/components/Logo.tsx): on a deep ink rounded square,
       three white sound bars run into a cyan text cursor. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#tile)"/>
  <rect x="244" y="402" width="84" height="220" rx="42" fill="#FFFFFF"/>
  <rect x="376" y="302" width="84" height="420" rx="42" fill="#FFFFFF"/>
  <rect x="508" y="362" width="84" height="300" rx="42" fill="#FFFFFF"/>
  <rect x="708" y="232" width="72" height="560" rx="36" fill="url(#cursor)"/>
</svg>
